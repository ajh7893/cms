<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 · CMS</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin admin-login">

<main class="login-card">
    <div class="brand">
        <span class="brand-mark">C</span>
        <h1>CMS 관리자</h1>
    </div>
    <p class="subtitle">관리자 계정으로 로그인하세요</p>

    <!-- 로그인 실패 메시지 -->
    <div class="login-error" th:if="${errorMessage}">
        ⚠ <span th:text="${errorMessage}">오류 메시지</span>
    </div>

    <form th:action="@{/admin/login}" method="post" autocomplete="off">
        <div class="field">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId"
                   th:value="${userId}" required autofocus
                   placeholder="관리자 아이디">
        </div>
        <div class="field">
            <label for="userPwd">비밀번호</label>
            <input type="password" id="userPwd" name="userPwd"
                   required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <p class="login-foot">
        <a th:href="@{/}">← 사이트로 돌아가기</a>
    </p>
</main>

</body>
</html>
