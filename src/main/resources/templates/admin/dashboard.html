<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 · CMS 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin">

<div class="admin-shell">

    <!-- 좌측 메뉴 (다음 단계에서 기능별로 채워 나간다) -->
    <aside class="admin-sidebar">
        <div class="brand">
            <span class="brand-mark">C</span> CMS 관리자
        </div>
        <nav class="admin-nav">
            <a th:href="@{/admin}" class="active">대시보드</a>
            <a th:href="@{/posts}">게시판 (사이트)</a>
            <a th:href="@{/contents}">페이지 (사이트)</a>
        </nav>
    </aside>

    <div class="admin-main">

        <!-- 상단바: 로그인한 관리자 정보 + 로그아웃 -->
        <header class="admin-topbar">
            <div class="who">
                <strong th:text="${admin.userName}">관리자</strong>
                <span th:text="'(' + ${admin.userId} + ')'">(id)</span>
                <span class="badge" th:text="${admin.groupName()}">슈퍼관리자</span>
            </div>
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="btn-ghost">로그아웃</button>
            </form>
        </header>

        <main class="admin-content">
            <h2>대시보드</h2>
            <p class="desc">기존 dmktweb 운영 데이터 현황 (읽기 전용 단계)</p>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="label">게시글</div>
                    <div class="value" th:text="${#numbers.formatInteger(postCount, 0, 'COMMA')}">0</div>
                    <div class="hint">bbs_board · 삭제 포함 전체</div>
                </div>
                <div class="stat-card">
                    <div class="label">정적 페이지</div>
                    <div class="value" th:text="${#numbers.formatInteger(contentCount, 0, 'COMMA')}">0</div>
                    <div class="hint">contents · 삭제 포함 전체</div>
                </div>
                <div class="stat-card">
                    <div class="label">회원</div>
                    <div class="value" th:text="${#numbers.formatInteger(memberCount, 0, 'COMMA')}">0</div>
                    <div class="hint">member_info · 삭제 포함 전체</div>
                </div>
            </div>
        </main>

    </div>
</div>

</body>
</html>
