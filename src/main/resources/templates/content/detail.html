<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${content.subject})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="container">
        <div class="card">
            <h1 th:text="${content.subject}">제목</h1>
            <div class="post-meta">
                <span th:text="${content.regDate != null ? #temporals.format(content.regDate, 'yyyy-MM-dd HH:mm') : ''}">등록일</span>
            </div>
            <div class="post-body" th:utext="${content.content}">본문</div>
        </div>
        <p style="margin-top:20px">
            <a class="btn secondary" th:href="@{/contents}">← 목록으로</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
